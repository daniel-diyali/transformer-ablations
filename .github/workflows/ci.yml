name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # The CPU wheel index keeps the torch download to ~200 MB instead of
        # pulling the CUDA build, which CI has no use for.
        run: |
          uv venv --python 3.11
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        # Tests must stay fast and CPU-only. A minute is the budget (NFR5);
        # this timeout catches anything that quietly starts needing a GPU.
        timeout-minutes: 5
        run: uv run pytest
